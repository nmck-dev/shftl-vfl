<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>SHFTL My Squad</title>
    <link rel="stylesheet" href="resources/css/header.css">
    <link rel="stylesheet" href="resources/css/footer.css">
    <link rel="stylesheet" href="resources/css/team.css">
</head>


<body>
    <div id="site-header"></div>
    <script src="/public/resources/js/header.js"></script>
    <script src="/public/resources/js/team.js"></script>

    <main>
        <div class="team-container">
            <div class="squad-container">
                <div class="squad-header">
                    <p class="team-name">TEAM NAME:</p>
                    <button class="manage">MANAGE</button>
                </div>
                
                <p class="type">Active Squad:</p>

                <div class="squad-grid">
                    <div class="duelist"></div>
                    <div class="initiator"></div>
                    <div class="controller"></div>
                    <div class="sentinel"></div>
                    <div class="wildcard"></div>
                    <div class="wildcard"></div>
                </div>
            </div>

            <p class="type">Bench players:</p>
            <div class="bench-container" id="bench">
                <div class="bench"></div>
                <div class="bench"></div>
                <div class="bench"></div>
            </div>
        </div>

    </main>

    <div id="site-footer"></div>
    <script src="resources/js/footer.js"></script>

    <div id="player-overlay" class="overlay hidden">
        <div class="overlay-content">
            <div class="overlay-header">
                <h2 id="overlay-title">Select Players</h2>
                <button id="close-overlay">&times;</button>
            </div>
            <div id="player-list" class="player-list">
                <!-- Filled dynamically via js -->
            </div>
        </div>
    </div>
</body>


</html>
