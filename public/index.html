<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale-1" />
    <title>SHFTL League Home</title>
    <link rel="stylesheet" href="resources/css/header.css">
    <link rel="stylesheet" href="resources/css/footer.css">
    <link rel="stylesheet" href="resources/css/index.css">
</head>


<body>

    <div id="site-header"></div>
    <script src="/SHFTL-VFL/resources/js/header.js"></script>

    <main>

        <div class="main-title">
            <h1>SuperHappyFunTimeLand</h1>
            <h2>Valorant Fantasy League</h2>
        </div>
        <div class="fixtures-container">
            <div class="weekly-fixtures">
                No matches this week.
            </div>
        </div>
        <div class="content-container">
            <div class="top-five">
                <div class="leaderboard-row">
                    <div class="leaderboard">Leaderboard</div>
                    <div class="leaderboard-dropdown">
                        <select id="leaderboard-filter">
                            <option value="overall">Overall</option>
                            <option value="kickoff">Kick-off</option>
                            <option value="masters1">Masters 1</option>
                            <option value="split1">Split 1</option>
                            <option value="masters2">Masters 2</option>
                            <option value="champions">Champions 2026</option>
                        </select>
                    </div>
                </div>
                
                <div class="teams">
                    <div class="team"></div>
                    <div class="team"></div>
                    <div class="team"></div>
                    <div class="team"></div>
                    <div class="team"></div>  
                </div>
            </div>
            <div class="top-players">
                <div class="weekly-players">Top Players</div>
                <div class="players">
                    <div class="player"></div>
                    <div class="player"></div>
                    <div class="player"></div>
                    <div class="player"></div>
                    <div class="player"></div>  
                </div>

            </div>
        </div>

    </main>

    <div id="site-footer"></div>
    <script src="/SHFTL-VFL/resources/js/footer.js"></script>

</body>

</html>
